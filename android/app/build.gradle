apply plugin: 'com.android.application'

android {
    namespace 'com.raekwon.supermetroid'
    compileSdk 33
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.raekwon.supermetroid'
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-21'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
