[General]
# Automatically save state on quit and reload on start
Autosave = 0

# Disable the SDL_Delay that happens each frame (Gives slightly better perf if your
# display is set to exactly 60hz)
DisableFrameDelay = 0

# Samus runs by default; holding the run/shoot button (see [GamepadMap]'s
# Controls list, position 7 = B) makes her walk instead, for precise
# platforming. Ported from the "Auto Run" Special Setting in the Control
# Freak 2 ROM hack - no separate run-toggle button needed (an earlier
# attempt at that conflicted with the shoot button, since vanilla SM has no
# dedicated run button of its own).
AutoRun = 1

[Graphics]
# Window size ( Auto or WidthxHeight )
WindowSize = Auto

# Fullscreen mode (0=windowed, 1=desktop fullscreen, 2=fullscreen w/mode change)
# Irrelevant on Android - MainActivity already forces the Activity fullscreen/immersive.
Fullscreen = 0

# Window scale (1=100%, 2=200%, 3=300%, etc.)
WindowScale = 3

# Use an optimized (but potentially more buggy) SNES PPU implementation
NewRenderer = 1

# Display the world map with higher resolution
EnhancedMode7 = 1

# Don't keep the aspect ratio
IgnoreAspectRatio = 0

# Enable this option to remove the sprite limits per scan line
NoSpriteLimits = 1

# Android always uses the SDL_Renderer backend regardless of this setting
# (see the __ANDROID__ guard in main.c - opengl.c isn't even compiled in).
OutputMethod = SDL

# Set to true to use linear filtering. Gives less crisp pixels.
LinearFiltering = 0

[Sound]
EnableAudio = 1

# DSP frequency in samples per second (e.g. 48000, 44100, 32000, 22050, 11025)
AudioFreq = 32000

# number of separate sound channels (1=mono, 2=stereo)
AudioChannels = 2

# Audio buffer size in samples (power of 2; e.g., 4096, 2048, 1024) [try 1024 if sound is crackly].
AudioSamples = 512

[GamepadMap]
# Any keys used in KeyMap can be used also in this section.
# The shoulder button is called L1/Lb and L2, and the thumbstick button is called L3
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb

# No physical keyboard on Android, so the desktop's F1-F10 quicksave/load
# keys are unreachable there - bind a gamepad combo instead. Hold L1+R1 and
# press Start to quicksave, or Back/Select to quickload (slot 0).
Save = L1+R1+Start
Load = L1+R1+Back

# Cycle the currently-armed ammo (Missile/Super/Power Bomb/none) without
# needing to open the second screen's AMMO tab - same effect as pressing
# Select on the controller repeatedly (skips any type with 0 owned), just
# reachable from a single button instead. L2/R2 aren't used by SM itself
# (SNES only has 8 real buttons), so they're free for this.
# NOTE (Android/Thor build specifically): this binding only takes effect on
# gamepads where SDL actually reports L2/R2 as SDL_CONTROLLERAXISMOTION
# trigger events. The Thor's own built-in controller reports them as plain
# digital key events instead (AKEYCODE_BUTTON_L2/R2), which SDL's Android
# joystick layer maps to raw joystick button indices outside the
# SDL_GameController button enum - main.c's gamepad event loop never sees
# them, so this line is a no-op on that specific hardware. For the Thor,
# L2/R2 are instead intercepted directly at the Android KeyEvent level in
# MainActivity.dispatchKeyEvent (see its own comment) - kept independent of
# this config file/section entirely.
CycleAmmoNext = R2
CycleAmmoPrev = L2
